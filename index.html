<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلفزيون سبها TV</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* حاوية الشاشة الرئيسية بنسبة 16:9 الثابتة */
        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            background-color: #0d0d0d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* تصميم شاشة الانتظار (عندما يكون البث متوقفاً) */
        #offline-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #offline-screen img {
            width: 55%;
            max-height: 55vh;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }

        .broadcast-info {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .broadcast-schedule {
            color: #00ffcc;
            font-size: 16px;
            margin-top: 8px;
            background: rgba(0, 255, 204, 0.1);
            padding: 6px 15px;
            border-radius: 20px;
        }

        /* نافذة البث المباشر */
        #live-container {
            width: 100%;
            height: 100%;
            display: none; /* مخفية افتراضياً */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <!-- شاشة الانتظار (تظهر في غياب البث) -->
        <div id="offline-screen">
            <!-- استبدل الرابط أدناه برابط صورتك أو شعارك المباشر -->
            <img src="ضع_رابط_صورتك_هنا.png" alt="شعار سبها TV">
            <div class="broadcast-info">البث متوقف مؤقتاً.. ننتظركم في المواعيد الرسمية</div>
            <div class="broadcast-schedule">📅 مواعيد البث: يومياً من السابعة مساءً إلى منتصف الليل</div>
        </div>

        <!-- نافذة البث المباشر الفعلي من Kick -->
        <div id="live-container">
            <iframe src="https://player.kick.com/sebhatv-ch" 
                    allowfullscreen="true" 
                    scrolling="no">
            </iframe>
        </div>
    </div>

    <script>
        // اجعلها true عندما تبدأ البث الفعلي، و false عندما ينتهي البث
        var isLive = false; 

        if (isLive) {
            document.getElementById('offline-screen').style.display = 'none';
            document.getElementById('live-container').style.display = 'block';
        } else {
            document.getElementById('offline-screen').style.display = 'flex';
            document.getElementById('live-container').style.display = 'none';
        }
    </script>

</body>
</html>
