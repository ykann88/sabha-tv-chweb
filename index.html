<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلفزيون سبها - البث المباشر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        /* مشغل البث المباشر من كيك يملأ الشاشة مع السماح بالتمرير لظهور خيارات الجودات */
        #live-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* شاشة الانتظار المؤقتة */
        #offline-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        #offline-screen img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        .broadcast-info {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .broadcast-schedule {
            color: #00ffcc;
            font-size: 16px;
            background: rgba(0, 255, 204, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="screen-container">
        
        <!-- شاشة الانتظار السوداء -->
        <div id="offline-screen">
            <!-- 📌 استبدل الرابط أدناه برابط شعار قناتك الـ PNG المباشر -->
            <img src="ضع_رابط_شعارك_هنا.png" alt="شعار تلفزيون سبها">
            
            <div class="broadcast-info">البث متوقف مؤقتاً.. ننتظركم في المواعيد الرسمية</div>
            <div class="broadcast-schedule">📅 مواعيد البث: يومياً من السابعة مساءً إلى منتصف الليل</div>
        </div>

        <!-- نافذة البث المباشر مع تفعيل الصوت والجودات الكاملة -->
        <div id="live-container">
            <iframe src="https://player.kick.com/sebhatv-ch?autoplay=true&muted=false" 
                    allowfullscreen="true" 
                    scrolling="yes" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
            </iframe>
        </div>

    </div>

    <script>
        async function checkLiveStatus() {
            try {
                let response = await fetch('https://kick.com/api/v2/channels/sebhatv-ch');
                let data = await response.json();
                let offlineScreen = document.getElementById('offline-screen');

                if (data && data.livestream && data.livestream.is_live === true) {
                    offlineScreen.style.opacity = '0';
                    setTimeout(() => {
                        offlineScreen.style.display = 'none';
                    }, 500);
                } else {
                    offlineScreen.style.display = 'flex';
                    offlineScreen.style.opacity = '1';
                }
            } catch (e) {
                console.log("جارٍ التحقق من البث...");
            }
        }

        checkLiveStatus();
        setInterval(checkLiveStatus, 10000);
    </script>

</body>
</html>
