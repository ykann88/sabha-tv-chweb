<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلفزيون سبها - البث المباشر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        
        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }

        /* نافذة البث المباشر من كيك (تأخذ الشاشة كاملة) */
        #live-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* شاشة الانتظار السوداء (تظهر الشعار، العبارة، ومواعيد البث) */
        #offline-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10; /* تكون فوق البث لتخفيه عند التوقف */
        }

        #offline-screen img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        .broadcast-info {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .broadcast-schedule {
            color: #00ffcc;
            font-size: 16px;
            background: rgba(0, 255, 204, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
        }

        /* زر يدوي لتبديل العرض عند الحاجة */
        .toggle-btn {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 20;
            background: rgba(255, 255, 204, 0.2);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="screen-container">
        
        <!-- شاشة الانتظار (تظهر الشعار ومواعيد البث) -->
        <div id="offline-screen">
            <!-- 📌 استبدل الرابط أدناه برابط شعار قناتك الـ PNG المباشر -->
            <img src="https://up6.cc/2026/10/179127789244141.png" alt="شعار تلفزيون سبها">
            
            <div class="broadcast-info">البث متوقف مؤقتاً.. ننتظركم في المواعيد الرسمية</div>
            <div class="broadcast-schedule">📅 مواعيد البث: يومياً من السابعة مساءً إلى منتصف الليل</div>
        </div>

        <!-- نافذة البث المباشر الحقيقي من موقع كيك بجودات كاملة وصوت -->
        <div id="live-container">
            <iframe src="https://player.kick.com/sebhatv-ch?autoplay=true" 
                    allowfullscreen="true" 
                    scrolling="no" 
                    allow="autoplay; encrypted-media; fullscreen">
            </iframe>
        </div>

    </div>

    <button class="toggle-btn" onclick="toggleScreen()">إظهار/إخفاء الشاشة</button>

    <script>
        // دالة اختيارية للتحكم اليدوي السريع في إظهار أو إخفاء شاشة الانتظار فوق البث
        function toggleScreen() {
            var screen = document.getElementById('offline-screen');
            if (screen.style.display === 'none') {
                screen.style.display = 'flex';
            } else {
                screen.style.display = 'none';
            }
        }
    </script>

</body>
</html>
