<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلفزيون سبها - البث المباشر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        
        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* حاوية البث المباشر من Kick */
        #live-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* تصميم شاشة الانتظار (تظهر عند توقف البث أو كخلفية) */
        #offline-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        #offline-screen img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .broadcast-info {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .broadcast-schedule {
            color: #00ffcc;
            font-size: 16px;
            background: rgba(0, 255, 204, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="screen-container">
        
        <!-- شاشة الانتظار (تظهر الشعار ومواعيد البث) -->
        <div id="offline-screen">
            <!-- 📌 ضع رابط شعار قناتك بصيغة PNG هنا مباشرة -->
            <img src="ضع_رابط_شعارك_هنا.png" alt="شعار تلفزيون سبها">
            
            <div class="broadcast-info">البث متوقف مؤقتاً.. ننتظركم في المواعيد الرسمية</div>
            <div class="broadcast-schedule">📅 مواعيد البث: يومياً من السابعة مساءً إلى منتصف الليل</div>
        </div>

        <!-- نافذة البث المباشر الحي من منصة Kick لقناتك sebhatv_ch -->
        <div id="live-container">
            <iframe src="https://player.kick.com/sebhatv_ch" 
                    allowfullscreen="true" 
                    scrolling="no" 
                    autoplay>
            </iframe>
        </div>

    </div>

</body>
</html>
