<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلفزيون سبها - البث المباشر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        
        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }

        /* نافذة البث المباشر من كيك */
        #live-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: none; /* مخفي افتراضياً حتى يتحقق السكريبت من حالة البث */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* شاشة الانتظار السوداء (تظهر الشعار، العبارة، ومواعيد البث) */
        #offline-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        #offline-screen img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        .broadcast-info {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .broadcast-schedule {
            color: #00ffcc;
            font-size: 16px;
            background: rgba(0, 255, 204, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="screen-container">
        
        <!-- شاشة الانتظار (تظهر الشعار ومواعيد البث في حالة التوقف) -->
        <div id="offline-screen">
            <!-- 📌 استبدل الرابط أدناه برابط شعار قناتك الـ PNG المباشر -->
            <img src="https://up6.cc/2026/10/179127789244141.png" alt="شعار تلفزيون سبها">
            
            <div class="broadcast-info">البث متوقف مؤقتاً.. ننتظركم في المواعيد الرسمية</div>
            <div class="broadcast-schedule">📅 مواعيد البث: يومياً من السابعة مساءً إلى منتصف الليل</div>
        </div>

        <!-- نافذة البث المباشر الحقيقي من موقع كيك -->
        <div id="live-container">
            <iframe id="kick-iframe" 
                    allowfullscreen="true" 
                    scrolling="no" 
                    allow="autoplay; encrypted-media; fullscreen">
            </iframe>
        </div>

    </div>

    <script>
        // دالة ذكية لفحص حالة البث المباشر لقناة sebhatv-ch من منصة كيك تلقائياً
        async function checkChannelStatus() {
            try {
                // استعلام بيانات القناة من واجهة كيك العامة
                let response = await fetch('https://kick.com/api/v2/channels/sebhatv-ch');
                let data = await response.json();
                
                let offlineScreen = document.getElementById('offline-screen');
                let liveContainer = document.getElementById('live-container');
                let iframe = document.getElementById('kick-iframe');

                // التحقق هل القناة تبث حالياً (livestream ليس فارغاً وليست null)
                if (data && data.livestream && data.livestream.is_live === true) {
                    // حالة البث: يعمل
                    if (liveContainer.style.display !== 'block') {
                        iframe.src = "https://player.kick.com/sebhatv-ch?autoplay=true";
                        liveContainer.style.display = 'block';
                    }
                    offlineScreen.style.display = 'none'; // إخفاء شاشة الشعار السوداء فوراً
                } else {
                    // حالة البث: متوقف
                    offlineScreen.style.display = 'flex'; // إظهار شاشة الشعار ومواعيد البث
                    liveContainer.style.display = 'none';
                    iframe.src = ""; // إيقاف تحميل مشغل كيك لمنع الصوت في الخلفية
                }
            } catch (error) {
                // في حال عدم توفر الاتصال أو حظر الـ API مؤقتأً، نظهر شاشة الانتظار كأمان
                console.log("جارٍ إعادة محاولة التحقق من حالة البث...");
            }
        }

        // فحص حالة البث فور فتح الصفحة
        checkChannelStatus();

        // إعادة فحص حالة البث تلقائياً كل 15 ثانية لضمان التبديل الفوري عند بدء أو انتهاء البث
        setInterval(checkChannelStatus, 15000);
    </script>

</body>
</html>
